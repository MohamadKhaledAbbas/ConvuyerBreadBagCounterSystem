# MediaMTX configuration for local content-camera 2 simulation (port 8555).
#
# This file is used ONLY on developer machines for the second content camera.
# Start:  see tools/sim_content_camera2.sh

# ── Network ───────────────────────────────────────────────────────────────
rtspAddress: :8555          # RTSP listen port (non-privileged; avoids sudo)
rtmpAddress: 
hlsAddress:  
webrtcAddress: 
srtAddress: 

# Disable protocols that use conflicting UDP ports
webrtc: no
srt: no

# Force RTSP to use TCP only to avoid UDP port conflicts
rtsp: yes
rtspTCP: yes
protocols: [tcp]

# ── Auth ──────────────────────────────────────────────────────────────────
# Allow any credentials (publisher = ffmpeg, reader = content recorder).
authInternalUsers:
- user: any
  pass:
  ips: []
  permissions:
  - action: publish
    path:
  - action: read
    path:
  - action: playback
    path:

# ── Logging ───────────────────────────────────────────────────────────────
logLevel: warn

# ── Paths ─────────────────────────────────────────────────────────────────
paths:
  cam/realmonitor:
    source: publisher
    sourceOnDemand: no
